<!doctype html>
<html lang="he" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Varela Round"; font-weight: 400; src: url("fonts/varela-round-hebrew-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Varela Round"; font-weight: 400; src: url("fonts/varela-round-latin-400-normal.woff2") format("woff2"); unicode-range: U+0000-00FF; }
      @font-face { font-family: "Heebo"; font-weight: 300; src: url("fonts/heebo-hebrew-300-normal.woff2") format("woff2"); }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0d0b0c; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      .shot { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; opacity: 0; }
      #sukkah { transform-origin: 50% 45%; }
      /* a soft dark veil behind the lyrics so white text reads on every shot */
      #veil { position: absolute; inset: 0; pointer-events: none;
              background: linear-gradient(to bottom, rgba(10, 8, 9, 0.58) 0%, rgba(10, 8, 9, 0.48) 40%, rgba(10, 8, 9, 0) 62%); }
      #fade { position: absolute; inset: 0; background: #0d0b0c; opacity: 0; }

      /* three sizes, like Dana: small connector words, big key words, one gold word per line */
      .lyric { position: absolute; left: 50px; right: 50px; top: 380px; direction: rtl; text-align: center;
               font-family: "Varela Round", sans-serif; color: #FBF8F2; text-shadow: 0 0 2px rgba(0,0,0,0.3), 0 3px 28px rgba(0,0,0,0.6); }
      .row { display: flex; justify-content: center; align-items: baseline; gap: 30px; direction: rtl; }
      .w { display: inline-block; opacity: 0; }
      .m { display: inline-block; overflow: hidden; padding: 0.06em 0.05em 0.16em; vertical-align: bottom; }
      .m > .in { display: inline-block; }
      .s { font-size: 96px; line-height: 1.15; opacity: 0; color: rgba(251, 248, 242, 0.9); }
      .k { font-size: 176px; line-height: 1.02; }
      .g { color: #E6CB92; }
      .xl { font-size: 250px; line-height: 1; }
      .letters { display: inline-flex; direction: rtl; }
      .letters > span { display: inline-block; opacity: 0; }
      #uline { height: 8px; width: 520px; margin: 6px auto 0; background: #E6CB92; border-radius: 4px; transform-origin: right center; }
      .credit { display: block; opacity: 0; margin-top: 30px; font-family: "Heebo", sans-serif; font-weight: 300;
                font-size: 42px; letter-spacing: 3px; color: rgba(251, 248, 242, 0.92); text-shadow: 0 1px 12px rgba(0, 0, 0, 0.8); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28" data-width="1080" data-height="1920">

      <img id="sukkah" class="shot" src="media/sukkah.jpg" alt="" />
      <video id="feet" class="shot" src="media/seg_feet.mp4" muted playsinline data-start="4.7" data-duration="5.5" data-track-index="0"></video>
      <video id="lights" class="shot" src="media/seg_lights.mp4" muted playsinline data-start="9.6" data-duration="5" data-track-index="1"></video>
      <video id="shadow" class="shot" src="media/seg_shadow.mp4" muted playsinline data-start="14" data-duration="5.5" data-track-index="0"></video>
      <video id="path" class="shot" src="media/seg_path.mp4" muted playsinline data-start="18.9" data-duration="9.1" data-track-index="1"></video>

      <div id="veil"></div>

      <div class="lyric" id="A">
        <div class="row"><span class="w s" id="a1">אחרי</span></div>
        <div class="row"><span class="m k" id="a2"><span class="in">החגים</span></span></div>
        <div class="row"><span class="w s" id="a3" style="font-size:110px">יתחדש</span><span class="m k g" id="a4"><span class="in">הכל</span></span></div>
      </div>
      <div class="lyric" id="B">
        <div class="row"><span class="w s" id="b1">יתחדשו</span><span class="w s" id="b2">וישובו</span></div>
        <div class="row"><span class="w s" id="b3" style="font-size:120px">ימי</span><span class="m k g" id="b4"><span class="in">החול</span></span></div>
      </div>
      <div class="lyric" id="C">
        <div class="row"><span class="m k" id="c1"><span class="in">האוויר,</span></span></div>
        <div class="row"><span class="m k" id="c2"><span class="in">העפר,</span></span></div>
        <div class="row"><span class="m k" id="c3"><span class="in">המטר</span></span><span class="m k g" id="c4"><span class="in">והאש</span></span></div>
      </div>
      <div class="lyric" id="D" style="top:520px">
        <div class="row"><span class="m k" id="d1"><span class="in">גם</span></span><span class="m k" id="d2"><span class="in">אתה,</span></span></div>
      </div>
      <div class="lyric" id="E">
        <div class="row"><span class="w s" id="e1" style="font-size:120px">גם אתה,</span></div>
        <div class="row"><span class="letters xl g" id="e2"><span>ת</span><span>ת</span><span>ח</span><span>ד</span><span>ש</span></span></div>
        <div id="uline"></div>
        <span class="credit" id="e3">נעמי שמר</span>
      </div>

      <div id="fade"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // shots: each one dissolves in over the last (0.6s), the photo drifts in slowly
      tl.set("#sukkah", { opacity: 1 }, 0);
      tl.fromTo("#sukkah", { scale: 1.0 }, { scale: 1.09, duration: 5.4, ease: "none" }, 0);
      [["#feet", 4.7], ["#lights", 9.6], ["#shadow", 14.0], ["#path", 18.9]].forEach(([id, t]) => {
        tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "sine.inOut" }, t);
      });
      tl.set("#sukkah", { opacity: 0 }, 5.4);
      tl.set("#feet", { opacity: 0 }, 10.3);
      tl.set("#lights", { opacity: 0 }, 14.7);
      tl.set("#shadow", { opacity: 0 }, 19.6);

      // lyrics, word by word with a different entrance per role
      const conn = (sel, t) => tl.fromTo(sel, { opacity: 0, y: 30, filter: "blur(8px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power2.out" }, t);
      const mask = (sel, t) => tl.fromTo(sel + " > .in", { yPercent: 115 }, { yPercent: 0, duration: 0.7, ease: "power3.out" }, t);
      const accent = (sel, t) => tl.fromTo(sel + " > .in", { yPercent: 0, opacity: 0, scale: 1.35, filter: "blur(12px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.85, ease: "expo.out" }, t);
      const out = (sel, t) => tl.to(sel + " .row", { opacity: 0, y: -34, filter: "blur(6px)", duration: 0.42, ease: "power2.in", stagger: 0.07 }, t);

      conn("#a1", 0.35); mask("#a2", 0.75); conn("#a3", 1.6); accent("#a4", 2.15); out("#A", 4.25);
      conn("#b1", 5.3); conn("#b2", 5.75); conn("#b3", 6.5); accent("#b4", 7.0); out("#B", 9.15);
      mask("#c1", 10.2); mask("#c2", 10.75); mask("#c3", 11.45); accent("#c4", 12.05); out("#C", 13.55);
      mask("#d1", 14.9); mask("#d2", 15.3); out("#D", 18.3);
      conn("#e1", 19.5);
      tl.fromTo("#e2 > span", { opacity: 0, y: 46, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.6, ease: "power3.out", stagger: 0.11 }, 20.9);
      tl.fromTo("#uline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 21.9);
      conn("#e3", 23.2);

      // close softly to dark so the loop restarts on the sukkah
      tl.to("#fade", { opacity: 1, duration: 0.9, ease: "sine.in" }, 27.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
