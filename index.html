<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>הדשבורד שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Varela+Round&display=swap" rel="stylesheet">
<style>
:root{
  --purple:#4A3463;
  --sage:#9CA88E;
  --gold:#C9A86A;
  --pink:#C99AA0;
  --cream:#FBF6EF;
  --card:#FFFFFF;
  --ink:#3B3341;
  --muted:#8E8794;
  --line:#EDE5DA;
  --shadow:0 2px 10px rgba(74,52,99,.06);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'Assistant',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,.font-title{font-family:'Varela Round','Assistant',sans-serif;font-weight:400}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 80px}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
header.top h1{font-size:26px;margin:0;color:var(--purple)}
header.top .sub{color:var(--muted);font-size:14px}
.io{margin-inline-start:auto;display:flex;gap:8px;align-items:center}

/* sync state */
.sync{display:none;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 13px;white-space:nowrap}
.sync.on{display:inline-flex}
.sync i{width:8px;height:8px;border-radius:50%;background:#DAD3CB;flex:none}
.sync.ok i{background:var(--sage)}
.sync.busy i{background:var(--gold);animation:pulse 1.1s ease-in-out infinite}
.sync.err i{background:var(--pink)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.sync.busy i{animation:none}}

/* buttons */
button{font-family:inherit;font-size:14px;cursor:pointer;border:none;background:none;color:inherit}
.btn{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;color:var(--ink);transition:.15s;box-shadow:var(--shadow)
}
.btn:hover{border-color:var(--purple);color:var(--purple)}
.btn.solid{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn.solid:hover{opacity:.9;color:#fff}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

/* progress */
.progress-box{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:18px}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;margin-bottom:10px}
.progress-head b{font-family:'Varela Round',sans-serif;color:var(--purple);font-size:16px}
.bar{height:8px;background:#F0EBE3;border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--sage);border-radius:999px;transition:width .35s ease}

/* focus */
.focus{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:22px;box-shadow:var(--shadow)}
.focus h2{font-size:19px;margin:0 0 4px;color:var(--purple)}
.focus .hint{font-size:13px;color:var(--muted);margin-bottom:12px}
.focus-empty{font-size:14px;color:var(--muted);background:var(--cream);border-radius:12px;padding:14px;text-align:center}
.focus-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream);border-radius:12px;margin-bottom:8px}
.focus-item:last-child{margin-bottom:0}
.focus-item .ftitle{flex:1;font-size:15px}
.focus-item.is-done .ftitle{text-decoration:line-through;opacity:.5}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:#DAD3CB}
.dot.doing{background:var(--gold)}
.dot.done{background:var(--sage)}

/* add */
.add-row{display:flex;gap:8px;margin-bottom:16px}
.add-row input{
  flex:1;font-family:inherit;font-size:15px;padding:13px 16px;border-radius:999px;
  border:1px solid var(--line);background:#fff;color:var(--ink);box-shadow:var(--shadow)
}
.add-row input:focus{outline:none;border-color:var(--purple)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--muted)}
.chip.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.chip.cat.active{color:#fff}
.switch{display:flex;align-items:center;gap:8px;margin-inline-start:auto;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;background:#E3DCD3;border-radius:999px;position:relative;transition:.2s;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked{background:var(--sage)}
.switch input:checked::after{transform:translateX(-16px)}

/* card */
#list{min-height:40px}
.task-card{
  position:relative;background:var(--card);border-radius:var(--radius);padding:14px 16px 14px 14px;
  margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--line);
  border-inline-start:4px solid transparent;transition:box-shadow .15s,opacity .15s
}
.task-card.doing{border-inline-start-color:var(--gold)}
.task-card.done{border-inline-start-color:var(--sage)}
.task-card.done .title{text-decoration:line-through;opacity:.5}
.card-main{display:flex;align-items:flex-start;gap:8px}
.handle{
  flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
  color:#CFC7BC;font-size:15px;cursor:grab;touch-action:none;border-radius:8px;margin-top:1px
}
.handle:active{cursor:grabbing}
.title{
  flex:1;font-size:16px;padding:2px 4px;border-radius:8px;min-width:0;word-break:break-word;
  outline:none;border:1px solid transparent;cursor:text
}
.title:hover{border-color:var(--line)}
.title:focus{border-color:var(--purple);background:#fff}
.icon-btn{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);transition:.15s}
.icon-btn:hover{background:var(--cream);color:var(--purple)}
.icon-btn.star.on{color:var(--gold)}
.icon-btn.del:hover{color:#C0603F}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-inline-start:34px}
.status-btn{border-radius:999px;padding:5px 13px;font-size:12.5px;border:1px solid var(--line);background:#FAF8F5;color:var(--muted)}
.status-btn.doing{background:rgba(201,168,106,.14);color:#8A6D2E;border-color:rgba(201,168,106,.4)}
.status-btn.done{background:rgba(156,168,142,.16);color:#5D6B4E;border-color:rgba(156,168,142,.45)}
.tag{border-radius:999px;padding:4px 11px;font-size:12px;color:#fff;white-space:nowrap}
.due{font-family:inherit;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff}
.due:focus{outline:none;border-color:var(--purple)}
.blocked{background:rgba(201,154,160,.18);color:#96626A;border:1px solid rgba(201,154,160,.5);border-radius:999px;padding:4px 11px;font-size:12px}
.notes{margin:10px 0 0;padding-inline-start:34px}
.notes textarea{
  width:100%;min-height:70px;resize:vertical;font-family:inherit;font-size:14px;color:var(--ink);
  background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 12px
}
.notes textarea:focus{outline:none;border-color:var(--purple)}
.has-notes{color:var(--purple)}

.task-card.dragging{opacity:.4}
.task-card.touch-dragging{opacity:.85;box-shadow:0 10px 26px rgba(74,52,99,.18);transform:rotate(-.4deg)}
.drop-placeholder{height:52px;border:2px dashed var(--gold);border-radius:var(--radius);margin-bottom:10px;background:rgba(201,168,106,.06)}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:30px 10px}

/* first sync: data is on screen but not touchable yet */
body.syncing .task-card,
body.syncing .focus-item,
body.syncing .add-row,
body.syncing .io .btn{opacity:.5;pointer-events:none}

/* toast */
#toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(24px);
  background:var(--purple);color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;
  box-shadow:0 8px 24px rgba(74,52,99,.28);opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:560px){
  .wrap{padding:16px 12px 70px}
  header.top h1{font-size:22px}
  .io{width:100%;margin-inline-start:0}
  .io .btn{flex:1}
  .filters{gap:6px}
  .chip{padding:6px 12px;font-size:13px}
  .switch{width:100%;margin-inline-start:0;margin-top:4px}
  .meta,.notes{padding-inline-start:0}
  .handle{width:34px;height:34px;font-size:17px}
  .task-card{padding:12px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>הדשבורד שלי</h1>
    <span class="sub">משימות העסק, במקום אחד</span>
    <div class="io">
      <span class="sync" id="sync"><i></i><span id="syncText"></span></span>
      <button class="btn" id="exportBtn">ייצוא</button>
      <button class="btn" id="importBtn">ייבוא</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </header>

  <div class="progress-box">
    <div class="progress-head">
      <span id="progressText">בוצעו 0 מתוך 0</span>
      <b id="progressPct">0%</b>
    </div>
    <div class="bar"><i id="progressBar" style="width:0%"></i></div>
  </div>

  <section class="focus">
    <h2>המיקוד שלי השבוע</h2>
    <div class="hint">עד שלוש משימות. סמני בכוכב על הכרטיס.</div>
    <div id="focusList"></div>
  </section>

  <div class="add-row">
    <input type="text" id="newTask" placeholder="מה עוד צריך לעשות?" autocomplete="off">
    <button class="btn solid" id="addBtn">הוסיפי משימה</button>
  </div>

  <div class="filters" id="filters"></div>

  <div id="list"></div>

</div>
<div id="toast"></div>

<script>
(function(){
"use strict";

var STORAGE_KEY = 'michal_tasks_dashboard_v1';

var CATEGORIES = {
  'הקמה ורגולציה': '#4A3463',
  'כלים ומנויים':  '#9CA88E',
  'שיווק ותוכן':   '#C9A86A',
  'מוצר והדרכות':  '#C99AA0'
};

var STATUSES = ['todo','doing','done'];
var STATUS_LABEL = { todo:'לא התחלתי', doing:'בתהליך', done:'בוצע' };
var STEP = 1000;

var SEED = [
  {id:'t1',  title:'לחפש רואה חשבון ולקבוע פגישה', category:'הקמה ורגולציה'},
  {id:'t2',  title:'לפתוח תיק עוסק פטור', category:'הקמה ורגולציה'},
  {id:'t3',  title:'לדבר עם עו"ד לגבי דף פרטיות ונגישות ולהוסיף לאתר ולכל דפי הנחיתה', category:'הקמה ורגולציה'},
  {id:'t4',  title:'לברר ולהחליט על חברת סליקה ולעשות מנוי', category:'כלים ומנויים', dependsOn:'t2'},
  {id:'t5',  title:'לברר ולעשות מנוי לזום', category:'כלים ומנויים'},
  {id:'t6',  title:'לברר ולעשות מנוי ל-ChatGPT', category:'כלים ומנויים'},
  {id:'t7',  title:'להתחיל להכניס תכנים לקבוצת הוואטסאפ ולכתוב תיאור קבוצה עם קישור לדף נחיתה של מגנט הלידים', category:'שיווק ותוכן'},
  {id:'t8',  title:'להכין תוכן לבוסט ולפרסום ממומן', category:'שיווק ותוכן', dependsOn:'t3'},
  {id:'t9',  title:'לקבוע פגישה רביעית עם לירז לגבי תוכנית שיווק (לשאול לגבי בוסט)', category:'שיווק ותוכן'},
  {id:'t10', title:'להכין שלד קבוע לשיחת מכירה לפי השיעור של לירז', category:'שיווק ותוכן'},
  {id:'t11', title:'להכין תוכן לרשתות לשבוע הקרוב', category:'שיווק ותוכן'},
  {id:'t12', title:'לאסוף עדויות והוכחות מהקולגות של יוצרות עסק', category:'שיווק ותוכן'},
  {id:'t13', title:'להכין הדרכה על פומלי ליום סושיאל של יוצרות עסק', category:'מוצר והדרכות'},
  {id:'t14', title:'להקליט הדרכה בזום על פומלי עם יוליה', category:'מוצר והדרכות'},
  {id:'t15', title:'להכין הדרכת מתנה מוקלטת על פומלי כמגנט לידים', category:'מוצר והדרכות'},
  {id:'t16', title:'לעבור על תוכנית הליווי ולבדוק אם נדרשים שינויים', category:'מוצר והדרכות'}
];

var state = loadCache();
var ui = { filter:'all', category:'all', hideDone:false };

/* The page runs in two modes. Opened as a file it keeps everything in
   localStorage. Opened through the hosted link it mirrors the same data
   into the shared store, so the phone and the laptop see one list. */
var cloud = { db:null, live:false, clientId:'c' + Math.random().toString(36).slice(2,10) };
var pendingRemote = null;
var dirty = {};   /* tasks with an edit typed but not written yet */

/* ---------- local cache ---------- */

function seedTasks(){
  return SEED.map(function(s, i){
    return {
      id:s.id, title:s.title, category:s.category,
      due:'', status:'todo', notes:'', focus:false,
      notesOpen:false, dependsOn:s.dependsOn || null, order:(i+1)*STEP
    };
  });
}

function loadCache(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      var data = JSON.parse(raw);
      if(data && Array.isArray(data.tasks)) return { tasks:data.tasks.map(normalize) };
    }
  }catch(e){ console.warn('טעינה מהדפדפן נכשלה, מתחילים מהרשימה ההתחלתית', e); }
  var fresh = { tasks:seedTasks() };
  writeCache(fresh);
  return fresh;
}

function normalize(t, i){
  return {
    id: t.id || uid(),
    title: typeof t.title === 'string' ? t.title : '',
    category: CATEGORIES[t.category] ? t.category : '',
    due: t.due || '',
    status: STATUSES.indexOf(t.status) > -1 ? t.status : 'todo',
    notes: t.notes || '',
    focus: !!t.focus,
    notesOpen: !!t.notesOpen,
    dependsOn: t.dependsOn || null,
    order: typeof t.order === 'number' ? t.order : (i + 1) * STEP
  };
}

function writeCache(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s || state)); }
  catch(e){ /* private mode or a full quota: the cloud copy still holds */ }
}

function uid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function byId(id){ for(var i=0;i<state.tasks.length;i++){ if(state.tasks[i].id===id) return state.tasks[i]; } return null; }

/* ---------- persistence ---------- */

function body(t){
  return {
    title:t.title, category:t.category, due:t.due, status:t.status,
    notes:t.notes, focus:!!t.focus, notesOpen:!!t.notesOpen,
    dependsOn:t.dependsOn || null, order:t.order
  };
}

function fromDoc(d){
  var b = d.data() || {};
  return normalize({
    id:d.id, title:b.title, category:b.category, due:b.due, status:b.status,
    notes:b.notes, focus:b.focus, notesOpen:b.notesOpen,
    dependsOn:b.dependsOn, order:b.order
  });
}

function cloudTrouble(){
  setSync('err', 'הסנכרון נתקע');
  document.body.classList.remove('syncing');
}

/* Every mutation goes through one of these three. */
function saveTasks(tasks){
  writeCache();
  if(!cloud.live) return;
  tasks.forEach(function(t){
    cloud.db.collection('tasks').doc(t.id).set(body(t)).catch(cloudTrouble);
  });
}

function removeTask(id){
  writeCache();
  if(!cloud.live) return;
  cloud.db.collection('tasks').doc(id).delete().catch(cloudTrouble);
}

function saveEverything(removedIds){
  writeCache();
  if(!cloud.live) return;
  (removedIds || []).forEach(function(id){
    cloud.db.collection('tasks').doc(id).delete().catch(cloudTrouble);
  });
  saveTasks(state.tasks);
}

/* ---------- cloud ---------- */

function setSync(kind, text){
  var el = document.getElementById('sync');
  el.className = 'sync on ' + kind;
  document.getElementById('syncText').textContent = text;
}

function startCloud(){
  if(!(window.claude && typeof window.claude.use === 'function')) return;
  setSync('busy', 'מסתנכרן...');
  document.body.classList.add('syncing');
  window.claude.use('db').then(function(db){
    if(!db){ localOnly(); return; }
    cloud.db = db;
    bootstrap();
  }, localOnly);
}

function localOnly(){
  document.body.classList.remove('syncing');
  setSync('off', 'שמור בדפדפן הזה');
}

function bootstrap(){
  cloud.db.doc('meta/state').get().then(function(d){
    if(d.exists && d.data() && d.data().seeded) return listen();
    return cloud.db.doc('meta/seed').acquire({holder:cloud.clientId, ttlMs:15000}).then(function(res){
      if(!res.acquired) return listen();   /* another device is filling the store */
      var tasks = state.tasks.slice();
      tasks.forEach(function(t, i){ t.order = (i+1)*STEP; });
      return Promise.all(tasks.map(function(t){
        return cloud.db.collection('tasks').doc(t.id).set(body(t));
      })).then(function(){
        return cloud.db.doc('meta/state').set({seeded:true});
      }).then(listen);
    });
  }).catch(cloudTrouble);
}

function listen(){
  cloud.db.collection('tasks').orderBy('order').onSnapshot(function(snap){
    cloud.live = true;
    document.body.classList.remove('syncing');
    applyRemote(snap.docs.map(fromDoc));
    setSync('ok', 'מסונכרן');
  }, cloudTrouble);
}

function signature(tasks){
  return JSON.stringify(tasks.map(function(t){
    return [t.id,t.title,t.category,t.due,t.status,t.notes,t.focus,t.dependsOn,t.order];
  }));
}

function editing(){
  var a = document.activeElement;
  return !!a && (a.classList.contains('title') || a.tagName === 'TEXTAREA');
}

function applyRemote(tasks){
  /* an edit still sitting in the debounce beats the incoming copy of it */
  tasks = tasks.map(function(t){ return dirty[t.id] ? (byId(t.id) || t) : t; });
  if(signature(tasks) === signature(state.tasks)) return;
  if(editing()){ pendingRemote = tasks; return; }   /* don't yank the cursor mid-sentence */
  pendingRemote = null;
  state.tasks = tasks;
  writeCache();
  render();
}

document.addEventListener('focusout', function(){
  setTimeout(function(){
    if(pendingRemote && !editing()) applyRemote(pendingRemote);
  }, 0);
});

/* ---------- helpers ---------- */

var toastTimer;
function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 3200);
}

function blockerOf(task){
  if(!task.dependsOn) return null;
  var b = byId(task.dependsOn);
  if(!b || b.status === 'done') return null;
  return b;
}

function visibleTasks(){
  return state.tasks.filter(function(t){
    if(ui.filter !== 'all' && t.status !== ui.filter) return false;
    if(ui.category !== 'all' && t.category !== ui.category) return false;
    if(ui.hideDone && t.status === 'done' && ui.filter !== 'done') return false;
    return true;
  });
}

/* ---------- render ---------- */

function render(){
  renderProgress();
  renderFocus();
  renderFilters();
  renderList();
}

function renderProgress(){
  var total = state.tasks.length;
  var done = state.tasks.filter(function(t){ return t.status==='done'; }).length;
  var pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('progressText').textContent = 'בוצעו ' + done + ' מתוך ' + total;
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressBar').style.width = pct + '%';
}

function renderFocus(){
  var box = document.getElementById('focusList');
  box.innerHTML = '';
  var items = state.tasks.filter(function(t){ return t.focus; });
  if(!items.length){
    var e = document.createElement('div');
    e.className = 'focus-empty';
    e.textContent = 'עוד לא בחרת מיקוד לשבוע. סמני עד שלוש משימות בכוכב.';
    box.appendChild(e);
    return;
  }
  items.forEach(function(t){
    var row = document.createElement('div');
    row.className = 'focus-item' + (t.status==='done' ? ' is-done' : '');
    var dot = document.createElement('span');
    dot.className = 'dot ' + t.status;
    var title = document.createElement('span');
    title.className = 'ftitle';
    title.textContent = t.title;
    var off = document.createElement('button');
    off.className = 'icon-btn star on';
    off.title = 'הסרה מהמיקוד';
    off.textContent = '★';
    off.addEventListener('click', function(){ t.focus = false; saveTasks([t]); render(); });
    row.appendChild(dot); row.appendChild(title); row.appendChild(off);
    box.appendChild(row);
  });
}

function renderFilters(){
  var box = document.getElementById('filters');
  box.innerHTML = '';

  var statusFilters = [['all','הכל'],['todo','לא התחלתי'],['doing','בתהליך'],['done','בוצע']];
  statusFilters.forEach(function(f){
    var b = document.createElement('button');
    b.className = 'chip' + (ui.filter===f[0] ? ' active' : '');
    b.textContent = f[1];
    b.addEventListener('click', function(){ ui.filter = f[0]; render(); });
    box.appendChild(b);
  });

  Object.keys(CATEGORIES).forEach(function(cat){
    var b = document.createElement('button');
    var on = ui.category === cat;
    b.className = 'chip cat' + (on ? ' active' : '');
    b.textContent = cat;
    if(on){ b.style.background = CATEGORIES[cat]; b.style.borderColor = CATEGORIES[cat]; }
    else { b.style.color = CATEGORIES[cat]; }
    b.addEventListener('click', function(){ ui.category = on ? 'all' : cat; render(); });
    box.appendChild(b);
  });

  var lbl = document.createElement('label');
  lbl.className = 'switch';
  var cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = ui.hideDone;
  cb.addEventListener('change', function(){ ui.hideDone = cb.checked; render(); });
  lbl.appendChild(cb);
  lbl.appendChild(document.createTextNode('הסתר משימות שבוצעו'));
  box.appendChild(lbl);
}

function renderList(){
  var listEl = document.getElementById('list');
  listEl.innerHTML = '';
  var items = visibleTasks();
  if(!items.length){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'אין כאן משימות שמתאימות לסינון הנוכחי.';
    listEl.appendChild(e);
    return;
  }
  items.forEach(function(t){ listEl.appendChild(taskCard(t)); });
}

function taskCard(t){
  var card = document.createElement('div');
  card.className = 'task-card ' + t.status;
  card.dataset.id = t.id;

  var main = document.createElement('div');
  main.className = 'card-main';

  var handle = document.createElement('div');
  handle.className = 'handle';
  handle.title = 'גררי כדי לשנות סדר';
  handle.textContent = '⠿';
  handle.addEventListener('mousedown', function(){ card.draggable = true; });
  handle.addEventListener('touchstart', function(e){ startTouchDrag(e, card); }, {passive:false});

  var title = document.createElement('div');
  title.className = 'title';
  title.contentEditable = 'true';
  title.spellcheck = false;
  title.textContent = t.title;
  title.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); title.blur(); }
    if(e.key === 'Escape'){ title.textContent = t.title; title.blur(); }
  });
  title.addEventListener('blur', function(){
    var v = title.textContent.trim();
    if(!v){ title.textContent = t.title; return; }
    if(v !== t.title){ t.title = v; saveTasks([t]); render(); }
  });

  var star = document.createElement('button');
  star.className = 'icon-btn star' + (t.focus ? ' on' : '');
  star.title = t.focus ? 'הסרה מהמיקוד' : 'הוספה למיקוד השבוע';
  star.textContent = t.focus ? '★' : '☆';
  star.addEventListener('click', function(){ toggleFocus(t); });

  var noteBtn = document.createElement('button');
  noteBtn.className = 'icon-btn' + (t.notes ? ' has-notes' : '');
  noteBtn.title = 'הערות';
  noteBtn.textContent = '✎';

  var del = document.createElement('button');
  del.className = 'icon-btn del';
  del.title = 'מחיקה';
  del.textContent = '✕';
  del.addEventListener('click', function(){
    if(!confirm('למחוק את "' + t.title + '"?')) return;
    state.tasks = state.tasks.filter(function(x){ return x.id !== t.id; });
    var freed = state.tasks.filter(function(x){ return x.dependsOn === t.id; });
    freed.forEach(function(x){ x.dependsOn = null; });
    removeTask(t.id);
    if(freed.length) saveTasks(freed);
    render();
  });

  main.appendChild(handle);
  main.appendChild(title);
  main.appendChild(star);
  main.appendChild(noteBtn);
  main.appendChild(del);
  card.appendChild(main);

  var meta = document.createElement('div');
  meta.className = 'meta';

  var st = document.createElement('button');
  st.className = 'status-btn ' + t.status;
  st.textContent = STATUS_LABEL[t.status];
  st.addEventListener('click', function(){
    t.status = STATUSES[(STATUSES.indexOf(t.status) + 1) % 3];
    saveTasks([t]); render();
  });
  meta.appendChild(st);

  if(t.category){
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.style.background = CATEGORIES[t.category];
    tag.textContent = t.category;
    meta.appendChild(tag);
  }

  var due = document.createElement('input');
  due.type = 'date';
  due.className = 'due';
  due.value = t.due || '';
  due.title = 'תאריך יעד';
  due.addEventListener('change', function(){ t.due = due.value; saveTasks([t]); });
  meta.appendChild(due);

  var blocker = blockerOf(t);
  if(blocker){
    var b = document.createElement('span');
    b.className = 'blocked';
    b.textContent = '⚠ ממתין ל: ' + blocker.title;
    meta.appendChild(b);
  }

  card.appendChild(meta);

  var notesWrap = document.createElement('div');
  notesWrap.className = 'notes';
  notesWrap.hidden = !t.notesOpen;
  var ta = document.createElement('textarea');
  ta.placeholder = 'הערות למשימה...';
  ta.value = t.notes;
  var notesTimer;
  function flushNotes(){
    clearTimeout(notesTimer);
    if(!dirty[t.id]) return;
    delete dirty[t.id];
    saveTasks([t]);
  }
  ta.addEventListener('input', function(){
    t.notes = ta.value;
    noteBtn.classList.toggle('has-notes', !!ta.value);
    dirty[t.id] = true;
    clearTimeout(notesTimer);
    notesTimer = setTimeout(flushNotes, 500);
  });
  ta.addEventListener('blur', flushNotes);
  notesWrap.appendChild(ta);
  card.appendChild(notesWrap);

  noteBtn.addEventListener('click', function(){
    t.notesOpen = !t.notesOpen;
    notesWrap.hidden = !t.notesOpen;
    saveTasks([t]);
    if(t.notesOpen) ta.focus();
  });

  card.addEventListener('dragstart', function(e){
    dragId = t.id;
    card.classList.add('dragging');
    try{ e.dataTransfer.setData('text/plain', t.id); }catch(err){}
    e.dataTransfer.effectAllowed = 'move';
  });
  card.addEventListener('dragend', function(){
    card.draggable = false;
    card.classList.remove('dragging');
    finishDrop();
  });

  return card;
}

function toggleFocus(t){
  if(t.focus){ t.focus = false; }
  else{
    var count = state.tasks.filter(function(x){ return x.focus; }).length;
    if(count >= 3){ toast('שלוש משימות זה המקסימום. מה יורד?'); return; }
    t.focus = true;
  }
  saveTasks([t]); render();
}

/* ---------- reorder ---------- */

var dragId = null;
var placeholder = null;

function makePlaceholder(){
  var p = document.createElement('div');
  p.className = 'drop-placeholder';
  return p;
}

function positionPlaceholder(clientY, draggedCard){
  var listEl = document.getElementById('list');
  if(!placeholder) placeholder = makePlaceholder();
  var cards = Array.prototype.slice.call(listEl.querySelectorAll('.task-card')).filter(function(c){ return c !== draggedCard; });
  var target = null, before = false;
  for(var i=0;i<cards.length;i++){
    var r = cards[i].getBoundingClientRect();
    if(clientY < r.top + r.height/2){ target = cards[i]; before = true; break; }
    target = cards[i]; before = false;
  }
  if(!target){ listEl.appendChild(placeholder); return; }
  listEl.insertBefore(placeholder, before ? target : target.nextSibling);
}

/* Order lives in a number field so a drag writes one task, not the list.
   When two neighbours get too close to split, renumber everything. */
function reindex(moved, idx){
  var prev = state.tasks[idx-1], next = state.tasks[idx+1];
  var lo = prev ? prev.order : (next ? next.order - 2*STEP : 0);
  var hi = next ? next.order : (prev ? prev.order + 2*STEP : STEP);
  var mid = (lo + hi) / 2;
  if(!isFinite(mid) || hi - lo < 0.001){
    state.tasks.forEach(function(t, i){ t.order = (i+1)*STEP; });
    saveEverything();
    return;
  }
  moved.order = mid;
  saveTasks([moved]);
}

function finishDrop(){
  if(!placeholder || !placeholder.parentNode || !dragId){ cleanupDrag(); return; }
  var nextId = null, prevId = null, n;
  for(n = placeholder.nextElementSibling; n; n = n.nextElementSibling){
    if(n.classList.contains('task-card') && n.dataset.id !== dragId){ nextId = n.dataset.id; break; }
  }
  for(n = placeholder.previousElementSibling; n; n = n.previousElementSibling){
    if(n.classList.contains('task-card') && n.dataset.id !== dragId){ prevId = n.dataset.id; break; }
  }
  var arr = state.tasks;
  var from = arr.findIndex(function(t){ return t.id === dragId; });
  if(from > -1){
    var moved = arr.splice(from,1)[0];
    var idx;
    if(nextId) idx = arr.findIndex(function(t){ return t.id === nextId; });
    else if(prevId) idx = arr.findIndex(function(t){ return t.id === prevId; }) + 1;
    else idx = arr.length;
    if(idx < 0) idx = arr.length;
    arr.splice(idx, 0, moved);
    reindex(moved, idx);
  }
  cleanupDrag();
  render();
}

function cleanupDrag(){
  if(placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
  placeholder = null;
  dragId = null;
}

var listEl = document.getElementById('list');
listEl.addEventListener('dragover', function(e){
  if(!dragId) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  positionPlaceholder(e.clientY, listEl.querySelector('.task-card.dragging'));
});
listEl.addEventListener('drop', function(e){
  if(!dragId) return;
  e.preventDefault();
  finishDrop();
});

/* ---------- touch drag ---------- */

var touchDrag = null;

function startTouchDrag(e, card){
  if(e.touches.length !== 1) return;
  e.preventDefault();
  var t = e.touches[0];
  var r = card.getBoundingClientRect();
  dragId = card.dataset.id;
  touchDrag = { card:card, offsetY: t.clientY - r.top };
  placeholder = makePlaceholder();
  placeholder.style.height = r.height + 'px';
  card.parentNode.insertBefore(placeholder, card);
  card.classList.add('touch-dragging');
  card.style.position = 'fixed';
  card.style.width = r.width + 'px';
  card.style.left = r.left + 'px';
  card.style.top = r.top + 'px';
  card.style.zIndex = '50';
  card.style.pointerEvents = 'none';
  document.addEventListener('touchmove', onTouchMove, {passive:false});
  document.addEventListener('touchend', onTouchEnd);
  document.addEventListener('touchcancel', onTouchEnd);
}

function onTouchMove(e){
  if(!touchDrag) return;
  e.preventDefault();
  var t = e.touches[0];
  touchDrag.card.style.top = (t.clientY - touchDrag.offsetY) + 'px';
  positionPlaceholder(t.clientY, touchDrag.card);
  var margin = 70;
  if(t.clientY < margin) window.scrollBy(0, -12);
  else if(t.clientY > window.innerHeight - margin) window.scrollBy(0, 12);
}

function onTouchEnd(){
  document.removeEventListener('touchmove', onTouchMove, {passive:false});
  document.removeEventListener('touchend', onTouchEnd);
  document.removeEventListener('touchcancel', onTouchEnd);
  if(!touchDrag) return;
  var card = touchDrag.card;
  card.classList.remove('touch-dragging');
  card.style.cssText = '';
  touchDrag = null;
  finishDrop();
}

/* ---------- add ---------- */

function addTask(){
  var input = document.getElementById('newTask');
  var v = input.value.trim();
  if(!v) return;
  var first = state.tasks[0];
  var t = {
    id:uid(), title:v, category:'', due:'', status:'todo',
    notes:'', focus:false, notesOpen:false, dependsOn:null,
    order: first ? first.order - STEP : STEP
  };
  state.tasks.unshift(t);
  input.value = '';
  saveTasks([t]);
  render();
}
document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('newTask').addEventListener('keydown', function(e){
  if(e.key === 'Enter') addTask();
});

/* ---------- export / import ---------- */

/* In the hosted viewer a plain download link is inert, so the file goes
   through the host. Opened from disk, the anchor does the job. */
var hostSave = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('downloads').catch(function(){ return null; })
  : null;

function backupName(){
  var d = new Date();
  return 'tasks-backup-' + d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0') + '.json';
}

function saveWithAnchor(json, name){
  var url = URL.createObjectURL(new Blob([json], {type:'application/json'}));
  var a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('הקובץ ירד. שמרי אותו איפשהו בטוח.');
}

document.getElementById('exportBtn').addEventListener('click', function(){
  var json = JSON.stringify(state, null, 2);
  var name = backupName();
  if(!hostSave){ saveWithAnchor(json, name); return; }
  hostSave.then(function(dl){
    if(!dl){ saveWithAnchor(json, name); return; }
    dl.save({filename:name, data:json}).then(function(){
      toast('הגיבוי נשמר.');
    }, function(err){
      if(err && err.code === 'declined') return;
      toast('השמירה לא יצאה לדרך. אפשר לנסות שוב.');
    });
  });
});

document.getElementById('importBtn').addEventListener('click', function(){
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', function(e){
  var file = e.target.files && e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.tasks)) throw new Error('מבנה לא מוכר');
      var msg = cloud.live
        ? 'הייבוא יחליף את הרשימה בכל המכשירים (' + state.tasks.length + ' משימות כרגע). להמשיך?'
        : 'הייבוא יחליף את כל המשימות הקיימות (' + state.tasks.length + ' משימות). להמשיך?';
      if(!confirm(msg)) return;
      var oldIds = state.tasks.map(function(t){ return t.id; });
      var tasks = data.tasks.map(normalize);
      tasks.forEach(function(t, i){ t.order = (i+1)*STEP; });
      state.tasks = tasks;
      var keep = {};
      tasks.forEach(function(t){ keep[t.id] = true; });
      saveEverything(oldIds.filter(function(id){ return !keep[id]; }));
      render();
      toast('יובאו ' + tasks.length + ' משימות.');
    }catch(err){
      toast('הקובץ לא תקין. צריך קובץ JSON שיצא מכאן.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

render();
startCloud();
})();
</script>
